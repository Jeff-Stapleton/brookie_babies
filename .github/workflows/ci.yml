# Single CI/CD workflow: analyze, test and build the Flutter web app and the
# Cloud Functions, then deploy. Pull requests get a Hosting preview channel.
# Pushes to main deploy the functions and Firestore/Storage rules (keyless,
# see deploy-backend), then the live site. Deploys only run if the checks pass.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Superseded pull request runs are cancelled. Runs on main
# are never cancelled while running; a newer run replaces any run still
# waiting, so the latest commit is what goes live.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repo is public. Fail if any tracked file contains a Stripe secret
      # key, a webhook secret or a private key (e.g. a service account JSON).
      # Only file names are printed, never the matches.
      - name: Fail if a secret is in a tracked file
        run: |
          if git grep -lE '(sk|rk)_(live|test)_[0-9A-Za-z]{10,}|whsec_[0-9A-Za-z]{20,}|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo '::error::Secret found in the tracked files listed above'
            exit 1
          fi

      # Known gap: this action uses actions/cache by tag (not SHA) and does not
      # check the SDK download's sha256. Both come from Google/GitHub over TLS.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # The version that generated pubspec.lock. Upgrade deliberately.
          flutter-version: 3.47.7
          cache: true

      # Fail instead of silently rewriting pubspec.lock.
      - run: flutter pub get --enforce-lockfile

      # Infos (style lints) are not fatal yet because there is a backlog of
      # them; warnings and errors still fail the build.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build web --release

      # Never upload or deploy a bundle that contains a Stripe secret key.
      - name: Fail if a Stripe secret key is in the web bundle
        run: |
          if grep -rqE '\b(sk|rk)_(live|test)_[0-9A-Za-z]{10,}' build/web; then
            echo '::error::Stripe secret key found in build/web'
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

  functions:
    name: Build and test Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches "engines" in functions/package.json and the nodejs24
          # runtime in firebase.json.
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Fails instead of silently rewriting package-lock.json.
      - run: npm ci

      - run: npm run build

      # Unit tests with in-memory Firestore and Storage fakes; nothing here
      # talks to the real Firebase project.
      - run: npm test

  deploy-preview:
    name: Deploy preview channel
    needs: [check, functions]
    # Fork pull requests get no secrets, so they are checked but not deployed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # For firebase.json and .firebaserc.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: build/web

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROOKIE_BABIES }}
          projectId: brookie-babies
          expires: 7d
          # Exact version instead of the default `latest`; bump deliberately.
          firebaseToolsVersion: 15.32.1

  # Deploys the Cloud Functions and the Firestore/Storage rules. No stored key:
  # google-github-actions/auth trades this job's GitHub OIDC token for
  # short-lived credentials of the github-deployer service account (Workload
  # Identity Federation). Google only accepts tokens from this repository's
  # "production" environment on main (scripts/setup-gcp-deployer.sh), and
  # GitHub only lets main deploy to that environment
  # (scripts/setup-github-production.sh).
  #
  # Until the repository variable BACKEND_DEPLOY_LIVE is "true", this is a dry
  # run: it signs in, checks that the APIs, billing and service identities are
  # in place and compiles the rules and functions, without changing anything.
  # It doesn't exercise the upload/update/release permissions; the first live
  # run does (README, "Automatic backend deploys").
  deploy-backend:
    name: Deploy functions and rules
    needs: [check, functions]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # firebase-tools keeps its first access token (valid one hour) for the
    # whole deploy, so stay well under that.
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write # lets the auth step request this job's GitHub OIDC token
    steps:
      # Must run before the auth step: checkout cleans the workspace, which
      # would delete the credentials file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Newest 24.x rather than whatever the runner has cached: Node
          # 24.17.0 breaks the token exchange (nodejs/node#63989).
          check-latest: true
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            .github/deploy-tools/package-lock.json

      # id-token: write applies to the whole job, so any code that runs here
      # (install scripts, the functions build, the deploy) could request the
      # OIDC token. The protection is that every package is pinned by a
      # committed lockfile, not the order of the steps.
      #
      # The functions predeploy (tsc) and function discovery need these.
      - run: npm ci
        working-directory: functions

      # The Firebase CLI with its whole dependency tree pinned by
      # .github/deploy-tools/package-lock.json, and no install scripts (only
      # the optional re2 has one). Same version that did the first, manual
      # deploy; bump deliberately.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/deploy-tools
      - run: echo "$GITHUB_WORKSPACE/.github/deploy-tools/node_modules/.bin" >> "$GITHUB_PATH"

      # Exchanges this job's GitHub OIDC token at Google, so a wrong provider
      # or a token the attribute condition rejects fails here ("Failed to
      # generate Google Cloud federated token"). A missing impersonation
      # binding or permission shows up in the deploy step instead. Writes a
      # short-lived credentials file for GOOGLE_APPLICATION_CREDENTIALS; a post
      # step deletes it.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/375587092017/locations/global/workloadIdentityPools/github-actions/providers/brookie-babies-prod
          service_account: github-deployer@brookie-babies.iam.gserviceaccount.com

      - name: Deploy functions and rules
        env:
          # firebase-tools 15.34.0 otherwise insists on actAs for the App
          # Engine default service account (firebase/firebase-tools#11227).
          # Only its advisory checks are skipped; Google still enforces every
          # permission on the real API calls.
          FIREBASE_SKIP_INFORMATIONAL_IAM: "true"
          DRY_RUN: ${{ vars.BACKEND_DEPLOY_LIVE != 'true' && '--dry-run' || '' }}
        # --force: delete functions that were removed from the source.
        # Never add --debug here: this repository's logs are public, and debug
        # output includes API responses such as the signed URL the function
        # source is uploaded to. Debug locally instead (README).
        run: firebase deploy --only functions,firestore:rules,storage --project brookie-babies --non-interactive --force ${DRY_RUN:+"$DRY_RUN"}

  deploy-live:
    name: Deploy live site
    # After the backend. Once real backend deploys are on (BACKEND_DEPLOY_LIVE
    # is "true"), a failed backend deploy also holds back the site, so it never
    # goes live ahead of the functions and rules it relies on. A failed dry run
    # doesn't block it, since nothing would have been deployed anyway.
    needs: [check, functions, deploy-backend]
    if: >-
      ${{ !cancelled() &&
      needs.check.result == 'success' &&
      needs.functions.result == 'success' &&
      (needs.deploy-backend.result == 'success' || vars.BACKEND_DEPLOY_LIVE != 'true') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://brookie-babies.web.app
    permissions:
      contents: read
    steps:
      # For firebase.json and .firebaserc.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: build/web

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROOKIE_BABIES }}
          projectId: brookie-babies
          channelId: live
          # Exact version instead of the default `latest`; bump deliberately.
          firebaseToolsVersion: 15.32.1
